name: distributed-lab-base

include:
  - compose.infra.yaml

services:
  order-service:
    build:
      context: ../../implementation/distributed-baseline/order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - WAREHOUSE_URL=http://warehouse-service:3002/warehouse
      - BILLING_URL=http://billing-service:3003/billing
      - SHIPPING_URL=http://shipping-service:3004/shipping
    depends_on:
      order-db:
        condition: service_healthy

  warehouse-service:
    build:
      context: ../../implementation/distributed-baseline/warehouse-service
      dockerfile: Dockerfile
    container_name: warehouse-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      warehouse-db:
        condition: service_healthy

  billing-service:
    build:
      context: ../../implementation/distributed-baseline/billing-service
      dockerfile: Dockerfile
    container_name: billing-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    depends_on:
      billing-db:
        condition: service_healthy

  shipping-service:
    build:
      context: ../../implementation/distributed-baseline/shipping-service
      dockerfile: Dockerfile
    container_name: shipping-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    depends_on:
      shipping-db:
        condition: service_healthy
