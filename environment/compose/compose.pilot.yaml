# Overlay do compose.base.yaml para o piloto. Nenhuma réplica adicional.
services:
  order-service:
    build:
      context: ../../implementation/${PILOT_IMPLEMENTATION:-distributed-baseline}/order-service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40
  warehouse-service:
    build:
      context: ../../implementation/${PILOT_IMPLEMENTATION:-distributed-baseline}/warehouse-service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
