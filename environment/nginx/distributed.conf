# nginx cria 1 worker por thread/nucleo disponivel
worker_processes 2;
worker_rlimit_nofile 65536;

events {
    # 1024 conexoes simultaneas
    worker_connections 8192;
    multi_accept off;
}

http {
    log_format benchmark
        '$remote_addr [$time_iso8601] '
        '"$request" '
        'status=$status '
        'request_time=$request_time '
        'upstream_addr=$upstream_addr '
        'upstream_status=$upstream_status '
        'upstream_connect_time=$upstream_connect_time '
        'upstream_header_time=$upstream_header_time '
        'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log benchmark;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # mantem conexoes abertas para reutilizacao (evita overhead de reconexao)
    keepalive_timeout 65;
    keepalive_requests 10000;

    # upstream cria grupos de servidores (clusters)
    # nginx vai usar round robin para distribuir as conexoes
    upstream order_cluster {
        least_conn;
        server order-service:3001;
        keepalive 128; # mantem 128 conexoes abertas para reutilizacao
    }
    upstream warehouse_cluster {
        least_conn;
        server warehouse-service:3002;
        keepalive 128;
    }
    upstream billing_cluster {
        least_conn;
        server billing-service:3003;
        keepalive 128;
    }
    upstream shipping_cluster {
        least_conn;
        server shipping-service:3004;
        keepalive 128;
    }

    server {
        listen 80 reuseport;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # mapeia /health para /servico/health
        location /warehouse/health {
            proxy_pass http://warehouse_cluster/health;
        }

        location /billing/health {
            proxy_pass http://billing_cluster/health;
        }

        location /shipping/health {
            proxy_pass http://shipping_cluster/health;
        }

        location /order/health {
            proxy_pass http://order_cluster/health;
        }

        # mapeia /servico para /servico
        location /warehouse {
            proxy_pass http://warehouse_cluster;
        }

        location /billing {
            proxy_pass http://billing_cluster;
        }

        location /shipping {
            proxy_pass http://shipping_cluster;
        }

        location /order {
            proxy_pass http://order_cluster;
        }
    }
}
