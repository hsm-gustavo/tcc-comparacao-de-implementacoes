name: distributed-lab-base

include:
  - compose.infra.yaml

services:
  distributed-lb:
    image: nginx:alpine
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    container_name: distributed-lb
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ../nginx/distributed.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - order-service
      - warehouse-service
      - billing-service
      - shipping-service

  order-service:
    build:
      context: ../../implementation/distributed-baseline/order-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Internal traffic bypasses the edge proxy; Nginx remains the public
      # entry point used by k6.
      - WAREHOUSE_URL=http://distributed-lb/warehouse
      - BILLING_URL=http://distributed-lb/billing
      - SHIPPING_URL=http://distributed-lb/shipping
    depends_on:
      order-db:
        condition: service_healthy

  warehouse-service:
    build:
      context: ../../implementation/distributed-baseline/warehouse-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      warehouse-db:
        condition: service_healthy

  billing-service:
    build:
      context: ../../implementation/distributed-baseline/billing-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      billing-db:
        condition: service_healthy

  shipping-service:
    build:
      context: ../../implementation/distributed-baseline/shipping-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      shipping-db:
        condition: service_healthy
